<!DOCTYPE html>
<html lang="fr" class="dark">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>DoctiPlay Labs | Research &amp; Technology for Medical Simulation</title>
    <meta name="description" content="DoctiPlay Labs researches, builds and clinically validates AI-powered medical simulation tools for the next generation of clinicians. Based in Rabat, Morocco." />
    <meta name="theme-color" content="#05081A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&family=Instrument+Serif:ital@1&family=Cairo:wght@400;500;700&display=swap"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        // --- DoctiPlay Labs brand tokens ---
                        ink: "#05081A",
                        midnight: "#020E4F",
                        cerulean: {
                            DEFAULT: "#00ACCD",
                            dark: "#00839C",
                        },
                        glow: "#B5FFFE",
                        indigo: "#6366F0",
                        clinical: "#F7F9FC",
                        pulse: "#FF3B5C",
                        slate: {
                            50: "#F7F9FC",
                            100: "#EEF1F7",
                            200: "#DEE3EE",
                            300: "#C3CBDC",
                            400: "#98A2B8",
                            500: "#6B7690",
                            600: "#4E5872",
                            700: "#374056",
                            800: "#232A3D",
                            900: "#12162A",
                        },
                        // --- legacy aliases kept so existing components keep working ---
                        primary: {
                            DEFAULT: "#00ACCD",
                            glow: "#B5FFFE",
                            dark: "#00839C"
                        },
                        secondary: "#020E4F",
                        darkest: "#05081A",
                        accent: "#6366F0",
                        danger: "#FF3B5C",
                        pale: "#B5FFFE",
                        surface: "rgba(255, 255, 255, 0.04)",
                    },
                    fontFamily: {
                        display: ["Geist", "sans-serif"],
                        body: ["Geist", "Cairo", "sans-serif"],
                        mono: ["Geist Mono", "monospace"],
                        serif: ["Instrument Serif", "serif"],
                    },
                    letterSpacing: {
                        tightest: "-0.03em",
                        widemono: "0.08em",
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'fade-in-up': 'fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'slide-in-right': 'slideInRight 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'pulse-slow': 'pulse 6s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'scanline': 'scanline 8s linear infinite',
                        'glow-pulse': 'glowPulse 2s ease-in-out infinite',
                        'spin-slow': 'spin 12s linear infinite',
                        'draw-ecg': 'drawEcg 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'blink-dot': 'blinkDot 1.6s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        slideInRight: {
                            '0%': { transform: 'translateX(100%)' },
                            '100%': { transform: 'translateX(0)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
                            '50%': { transform: 'translateY(-15px) rotate(1deg)' },
                        },
                        scanline: {
                            '0%': { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(100%)' },
                        },
                        glowPulse: {
                            '0%, 100%': { opacity: '0.4', filter: 'brightness(1)' },
                            '50%': { opacity: '0.8', filter: 'brightness(1.5)' },
                        },
                        drawEcg: {
                            '0%': { strokeDashoffset: '1000' },
                            '100%': { strokeDashoffset: '0' },
                        },
                        blinkDot: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0.25' },
                        }
                    }
                },
            },
        };
    </script>
    <style>
        :root {
            color-scheme: dark;
        }

        html.dark body {
            background: #05081A;
            color: #EEF1F7;
        }

        html:not(.dark) body {
            background: #F7F9FC;
            color: #12162A;
        }

        body {
            font-family: 'Geist', 'Cairo', sans-serif;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Lab paper / graph grid texture, subtle */
        .lab-grid {
            position: relative;
        }

        .lab-grid::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(181, 255, 254, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(181, 255, 254, 0.05) 1px, transparent 1px);
            background-size: 48px 48px;
            -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 0%, transparent 75%);
            mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 0%, transparent 75%);
        }

        html:not(.dark) .lab-grid::before {
            background-image:
                linear-gradient(rgba(2, 14, 79, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(2, 14, 79, 0.04) 1px, transparent 1px);
        }

        .glass {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        html:not(.dark) .glass {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(2, 14, 79, 0.08);
        }

        .reveal {
            opacity: 0;
            transform: translateY(16px);
            transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform, opacity;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>

    <link rel="stylesheet" href="/index.css">

</head>
